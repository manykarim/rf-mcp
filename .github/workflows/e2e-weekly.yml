# Weekly agent evaluation (tests/e2e/agent_eval).
#
# Runs Claude Code on OpenRouter against the baseline suite (s1 triage+fix, s2 smoke by tag, s3 analyze, s4 XML
# authoring, s5 restful-booker CRUD, s6 SauceDemo with Browser, s7 live debugging) with rf-mcp as its only tool
# server, grades every run and publishes report.md as the job summary.
#
# - schedule / workflow_dispatch: real runs. They need the OPENROUTER_API_KEY secret and skip with a notice
#   without it. The default model (z-ai/glm-5.3-flash) passed 7/7 on 2026-11-09 at about $0.11 per suite run.
#   Agent misses do not fail the job; the report is the signal. The job fails only if the harness breaks.
# - pull_request touching the harness: a dry run that seeds every project and prints the agent commands,
#   without starting an agent or using a key.
name: Agent Eval (weekly)

on:
  schedule:
    - cron: '0 0 * * 0'   # Sundays 00:00 UTC
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated models (or-<vendor>.<model> for Claude Code on OpenRouter)"
        default: "or-z-ai.glm-5.3-flash"
      scenarios:
        description: "Comma-separated baseline scenarios (empty = all)"
        default: ""
      reps:
        description: "Runs per scenario and model"
        default: "1"
  pull_request:
    paths:
      - 'tests/e2e/agent_eval/**'
      - '.github/workflows/e2e-weekly.yml'

concurrency:
  group: agent-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Agent eval baseline (${{ github.event_name == 'pull_request' && 'dry run' || 'OpenRouter' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODELS: ${{ inputs.models || 'or-z-ai.glm-5.3-flash' }}
      REPS: ${{ inputs.reps || '1' }}
      SCENARIOS: ${{ inputs.scenarios }}
      DRY_RUN: ${{ github.event_name == 'pull_request' && '1' || '' }}
      HAS_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}

    steps:
      - name: Skip without an OpenRouter key
        if: env.DRY_RUN == '' && env.HAS_KEY != 'true'
        run: echo "::notice::OPENROUTER_API_KEY is not set; the agent evaluation was skipped."

      - uses: actions/checkout@v7
        if: env.DRY_RUN == '1' || env.HAS_KEY == 'true'

      - name: Setup uv
        if: env.DRY_RUN == '1' || env.HAS_KEY == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: 'latest'

      - name: Setup Node.js
        if: env.DRY_RUN == '' && env.HAS_KEY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install rf-mcp and the suite's libraries
        if: env.DRY_RUN == '1' || env.HAS_KEY == 'true'
        run: |
          uv python install 3.12
          uv sync --python 3.12 --group dev
          if [ -z "$DRY_RUN" ]; then
            uv pip install --python .venv/bin/python robotframework-requests robotframework-browser
            uv run --no-sync rfbrowser init --with-deps chromium
          fi

      - name: Install Claude Code
        if: env.DRY_RUN == '' && env.HAS_KEY == 'true'
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run the baseline suite
        if: env.DRY_RUN == '1' || env.HAS_KEY == 'true'
        env:
          # Only the agent process gets the key; the harness keeps it away from the MCP server and graders.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RF_EVAL_BASELINE_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          set -euo pipefail
          args=(baseline --models "$MODELS" --conditions mcp --reps "$REPS" --parallel 3 --out out/baseline)
          if [ -n "$SCENARIOS" ]; then args+=(--scenarios "$SCENARIOS"); fi
          if [ -n "$DRY_RUN" ]; then args+=(--dry-run); fi
          uv run --no-sync python -m tests.e2e.agent_eval "${args[@]}"

      - name: Publish the report
        if: always() && env.DRY_RUN == '' && env.HAS_KEY == 'true'
        run: |
          if [ -f out/baseline/report.md ]; then
            cat out/baseline/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no report.md was written"
          fi

      - name: Upload results
        if: always() && env.DRY_RUN == '' && env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-baseline
          path: |
            out/baseline/*.json
            out/baseline/*.jsonl
            out/baseline/report.md
          if-no-files-found: ignore
          retention-days: 30
