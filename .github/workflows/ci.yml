name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Unit and server tests, including the agent-eval grader tests under
    # tests/e2e/agent_eval. Nothing here calls a model or needs a browser.
    name: Test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 'latest'

      - name: Setup Python ${{ matrix.python-version }} (via uv)
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (dev)
        run: uv sync --python ${{ matrix.python-version }} --group dev

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q -rs --junitxml=results/pytest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python-version }}
          path: results/pytest.xml
          if-no-files-found: ignore

  installability:
    # Installs the built wheel as a THIRD-PARTY dependency with DEFAULT resolver
    # settings. Every other job installs rf-mcp from uv.lock, where the project's own
    # `prerelease = "allow"` hides an unresolvable pin (robotcode is a dev release).
    # Do not "simplify" this to `uv pip install -e .`.
    name: Installability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 'latest'

      - name: Setup Python 3.12 (via uv)
        run: uv python install 3.12

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: 'rf-mcp[otel] resolves with DEFAULT settings (no --prerelease)'
        shell: bash
        run: |
          set -euo pipefail
          echo "rf-mcp[otel]==$(uv run --no-project --python 3.12 python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" > req.txt
          cat req.txt
          uv pip compile req.txt --find-links dist --python-version 3.12 -o resolved.txt
          echo "--- resolved ---" && cat resolved.txt

      - name: 'uv tool install works with no flag'
        shell: bash
        run: |
          set -euo pipefail
          export UV_TOOL_DIR="$PWD/.uvtools" UV_TOOL_BIN_DIR="$PWD/.uvbin"
          mkdir -p "$UV_TOOL_BIN_DIR"
          WHEEL=$(ls dist/rf_mcp-*.whl)
          uv tool install --python 3.12 "${WHEEL}[otel]"
          "$UV_TOOL_BIN_DIR/robotmcp" --version
          "$UV_TOOL_BIN_DIR/rf-mcp" --version

  quality:
    # Code quality, code security, dependency advisories and maintainability.
    #
    # THIS JOB MUST NOT FAIL ON FINDINGS (change: ci-quality-scanning).
    # "Show the status, don't break the build" has no clean primitive in GitHub Actions:
    #   - step-level continue-on-error  -> job is green, failure invisible
    #   - job-level  continue-on-error  -> red X + "Some checks were not successful"
    # Both are wrong. So the analyzers are allowed to report findings and the job still
    # succeeds; the signal travels via the digest (log + run summary), the uploaded
    # reports, and code-scanning annotations.
    #
    # It DOES fail when an analyzer could not RUN. An analyzer that fails to install
    # reports zero findings, which is indistinguishable from a clean result unless the
    # two cases are kept apart. Do not "simplify" that away.
    name: Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write      # required to publish SARIF to code scanning
    # Analysis is platform- and interpreter-independent; a matrix would triple the cost
    # for identical results.

    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 'latest'

      - name: Setup Python 3.12 (via uv)
        run: uv python install 3.12

      - name: Install analyzers
        run: uv sync --group dev

      - name: Prepare reports directory
        run: mkdir -p reports

      # --- analysis -------------------------------------------------------------
      # Each analyzer writes its report and records its own exit status. `|| true`
      # keeps a findings-exit from ending the step; the RAN_* flags below separate
      # "found issues" from "could not run".

      - name: 'ruff: code quality (SARIF)'
        id: ruff_quality
        run: |
          uv run ruff check src/ --output-format=sarif > reports/quality.sarif || true
          test -s reports/quality.sarif || { echo "::error::ruff produced no SARIF - analyzer failed to run"; exit 1; }
          COUNT=$(uv run python -c "import json;print(len(json.load(open('reports/quality.sarif'))['runs'][0].get('results',[])))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: 'ruff: code security (SARIF)'
        id: ruff_security
        run: |
          uv run ruff check src/ --select S --output-format=sarif > reports/security.sarif || true
          test -s reports/security.sarif || { echo "::error::ruff -S produced no SARIF - analyzer failed to run"; exit 1; }
          # Ruff's SARIF marks EVERY finding level="error", so the SARIF level cannot
          # supply a severity tier - using it would report 222 "high" instead of the 6
          # that are. The tier comes from the declared rule set in
          # scripts/ci_sarif_severity.py, which is the SINGLE source for it: the
          # re-levelling step below reads the same set (change: ci-signal-fidelity).
          uv run python scripts/ci_sarif_severity.py count reports/security.sarif >> "$GITHUB_OUTPUT"

      - name: 'osv-scanner: dependency advisories (SARIF)'
        id: osv
        run: |
          OSV_VERSION=v2.6.0
          curl -sSfL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" \
            || { echo "::error::could not download osv-scanner - analyzer failed to run"; exit 1; }
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan source --lockfile uv.lock --format sarif > reports/deps.sarif || true
          test -s reports/deps.sarif || { echo "::error::osv-scanner produced no SARIF - analyzer failed to run"; exit 1; }
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          runs = json.load(open("reports/deps.sarif")).get("runs", [])
          rules = runs[0]["tool"]["driver"].get("rules", []) if runs else []
          # One SARIF rule per advisory. The affected PACKAGE is only in the rule's
          # help-text markdown table ("| transformers | 4.57.6 |") - rule ids are bare
          # CVE identifiers, and every result's location is just uv.lock, so neither
          # yields a package name. Require a letter-initial first column so version
          # numbers in other table rows are not mistaken for packages.
          pkgs, high = set(), 0
          for r in rules:
              txt = (r.get("help") or {}).get("text", "") or ""
              m = re.search(r"\|\s*([A-Za-z][A-Za-z0-9._-]+)\s*\|\s*[0-9][^|]*\|", txt)
              if m:
                  pkgs.add(m.group(1).lower())
              try:
                  if float((r.get("properties") or {}).get("security-severity") or 0) >= 7.0:
                      high += 1
              except ValueError:
                  pass
          print(f"count={len(rules)}")
          print(f"packages={len(pkgs)}")
          print(f"high={high}")
          PY

      - name: 'radon: maintainability'
        id: radon
        run: |
          uv run --with radon radon mi src/ -j > reports/maintainability.json || true
          uv run --with radon radon cc src/ -j > reports/complexity.json || true
          test -s reports/maintainability.json || { echo "::error::radon produced no report - analyzer failed to run"; exit 1; }
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          mi = json.load(open("reports/maintainability.json"))
          floor = [f for f, v in mi.items()
                   if isinstance(v, dict) and v.get("rank") == "C"]
          print(f"floor={len(floor)}")
          PY

      # --- reporting ------------------------------------------------------------

      - name: Digest
        if: always()
        run: |
          {
            echo "### Code quality"
            echo ""
            echo "| area | result |"
            echo "| --- | --- |"
            echo "| quality | ${{ steps.ruff_quality.outputs.count }} findings |"
            echo "| security | ${{ steps.ruff_security.outputs.count }} findings · ${{ steps.ruff_security.outputs.high }} high |"
            echo "| dependencies | ${{ steps.osv.outputs.count }} advisories · ${{ steps.osv.outputs.high }} high · ${{ steps.osv.outputs.packages }} packages |"
            echo "| maintainability | ${{ steps.radon.outputs.floor }} files at floor |"
            echo ""
            echo "Full reports: artifact \`quality-reports\`. Findings: repository **Security** tab (code scanning)."
            echo ""
            echo "_This check never fails on findings. It fails only if an analyzer could not run._"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: reports/
          if-no-files-found: error

      # Assign the severity we PUBLISH from the declared rule set, before upload.
      #
      # Ruff emits level="error" for every finding, so code scanning raises every one as
      # an error-level alert and fails a check named `ruff` whenever a pull request
      # touches a line near an existing finding - even when the contributor introduced
      # nothing. That violates this capability's own requirement that findings never
      # produce a failed check (PR #93 went red for two findings it only RELOCATED).
      #
      # Nothing is filtered: every finding is still uploaded, still in the artifact and
      # still counted in the digest. Only the level changes. The step fails if the
      # finding count changes, so this can never quietly become suppression.
      # (change: ci-signal-fidelity)
      - name: 'Map published severity (ruff SARIF)'
        if: always()
        run: |
          uv run python scripts/ci_sarif_severity.py relevel reports/quality.sarif
          uv run python scripts/ci_sarif_severity.py relevel reports/security.sarif

      # Distinct `category` per upload - without it, each SARIF REPLACES the previous
      # one in code scanning and only the last analyzer's findings remain visible.
      - name: 'Publish: code quality'
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/quality.sarif
          category: ruff-quality

      - name: 'Publish: code security'
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/security.sarif
          category: ruff-security

      - name: 'Publish: dependencies'
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/deps.sarif
          category: osv-dependencies
