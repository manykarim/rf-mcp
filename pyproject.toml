[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rf-mcp"
version = "0.33.0"
description = "Robot Framework MCP Server - Natural Language Test Automation Bridge"
authors = [{ name = "Many Kasiriha" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0",
    "robotframework>=7.0",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.0",
    "tomlkit>=0.12.0"
]

[project.optional-dependencies]
slim = []
web = ["robotframework-browser", "robotframework-seleniumlibrary"]
frontend = ["django>=4.2,<5.0", "uvicorn[standard]>=0.24"]
mobile = ["robotframework-appiumlibrary"]
api = ["robotframework-requests"]
database = ["robotframework-databaselibrary"]
memory = ["sqlite-vec>=0.1.6", "model2vec>=0.4.0"]
tokens = ["tiktoken>=0.7.0"]
# OBS-30 / lazy-offline-embeddings — semantic find_keywords ranking runs on a
# TORCH-FREE backend by default (model2vec, pulled by [memory]; benchmark
# recall@5=0.97 == fastembed). Enable with ROBOTMCP_SEMANTIC_KEYWORDS=1.
# This `semantic` extra installs sentence-transformers + torch (~2GB) as an
# OPTIONAL max-quality backend only — NOT required and NOT the default. Do not
# install it via `uv sync --all-extras` unless you specifically want the torch
# path; `[all]` deliberately excludes it. fastembed (ONNX, torch-free) is the
# lighter middle option.
semantic = ["sentence-transformers>=2.2.0", "scipy>=1.10.0"]
all = [
    "robotframework-browser",
    "robotframework-seleniumlibrary",
    "robotframework-appiumlibrary",
    "robotframework-requests",
    "robotframework-databaselibrary",
    "django>=4.2,<5.0",
    "uvicorn[standard]>=0.24",
    "sqlite-vec>=0.1.6",
    "model2vec>=0.4.0",
    "tiktoken>=0.7.0",
]
# NOTE: dev tooling lives in [dependency-groups].dev (PEP 735), which is what
# `uv sync` / CI use. The former [project.optional-dependencies].dev extra was
# unused legacy (no `pip install .[dev]` anywhere) and was removed to avoid drift
# (change: lazy-offline-embeddings §5.2).

[project.urls]
Homepage = "https://github.com/manykarim/rf-mcp"
Repository = "https://github.com/manykarim/rf-mcp"
"Bug Tracker" = "https://github.com/manykarim/rf-mcp/issues"
Documentation = "https://github.com/manykarim/rf-mcp#readme"

[project.scripts]
robotmcp = "robotmcp.entry:main"
rf-mcp = "robotmcp.entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robotmcp"]
include = [
    "src/robotmcp/frontend/templates/**/*.html",
    "src/robotmcp/frontend/static/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/robotmcp/**",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "tests",
    "examples",
]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
# Single source of truth for dev tooling (change: lazy-offline-embeddings §5.2/§5.3).
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-playwright>=0.7.1",
    "pytest-rerunfailures>=14.0",
    "black>=22.0.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
    "openai>=1.51.0",
    # §5.3: pydantic-ai-slim with ONLY the extras the 3 e2e test files use
    # (Agent/TestModel/UsageLimits core + OpenAIModel + FastMCPToolset). Drops the
    # bedrock/cohere/temporal/google/groq/vertexai zoo (boto3/botocore, temporalio,
    # fastavro, cohere, grpc — ~150MB of dev-only weight).
    "pydantic-ai-slim[openai,fastmcp]>=1.37.0",
    "python-dotenv>=1.0.1",
    "coverage[toml]>=7.6.0",
    "invoke>=2.2.0",
]

[tool.coverage.run]
branch = true
source = ["src/robotmcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true
