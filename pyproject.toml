[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rf-mcp"
version = "2.0.0"
description = "Robot Framework MCP Server powered by RobotCode CLI and Skills over MCP"
authors = [{ name = "Many Kasiriha" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0,<5",
    "robotcode[all]>=2.9.0.dev115",
    "pydantic>=2.0.0",
    "tomlkit>=0.12.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "ruff>=0.17.4",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/manykarim/rf-mcp"
Repository = "https://github.com/manykarim/rf-mcp"
"Bug Tracker" = "https://github.com/manykarim/rf-mcp/issues"
Documentation = "https://github.com/manykarim/rf-mcp#readme"

[project.scripts]
robotmcp = "robotmcp.entry:main"
rf-mcp = "robotmcp.entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robotmcp"]
include = [
    "src/robotmcp/skills/builtin/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/robotmcp/**",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "tests",
    "examples",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "coverage[toml]>=7.6.0",
    "ruff>=0.17.4",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["examples", "test_data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/robotmcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true
